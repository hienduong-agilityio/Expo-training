name: Build or Update Preview Native Apps

on:
  # Run automatically on push to main (after PRs are merged)
  push:
    branches: ['main']
  # Allow manual runs from the EAS dashboard or CLI
  workflow_dispatch: {}

jobs:
  fingerprint:
    # Calculate native fingerprints for Android + iOS so we can decide
    # whether to build a new binary or just publish an update.
    environment: preview
    type: fingerprint

  android_get_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: '${{ needs.fingerprint.outputs.android_fingerprint_hash }}'
      platform: android
      profile: preview

  android_update:
    needs: [android_get_build]
    if: '${{ needs.android_get_build.outputs.build_id }}'
    type: update
    params:
      channel: preview
      platform: android

  android_build:
    needs: [android_get_build]
    if: '${{ !needs.android_get_build.outputs.build_id }}'
    type: build
    params:
      platform: android
      profile: preview

  ios_get_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: '${{ needs.fingerprint.outputs.ios_fingerprint_hash }}'
      platform: ios
      profile: preview

  ios_update:
    needs: [ios_get_build]
    if: '${{ needs.ios_get_build.outputs.build_id }}'
    type: update
    params:
      channel: preview
      platform: ios

  ios_build:
    needs: [ios_get_build]
    if: '${{ !needs.ios_get_build.outputs.build_id }}'
    type: build
    params:
      platform: ios
      profile: preview
