stages:
  - test
  - secret-detection
  - eas-update

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

sast:
  stage: test

secret_detection:
  stage: secret-detection

# ─────────────────────────────────────────────────────────────────────────────
# EAS Update — manual gates
# ─────────────────────────────────────────────────────────────────────────────
# Yêu cầu CI/CD variables (Settings → CI/CD → Variables, type "Variable",
# masked + protected):
#   EXPO_TOKEN — robot token từ https://expo.dev/accounts/<owner>/settings/access-tokens
#
# Cả 2 job đều `when: manual` ⇒ không tự chạy, dev/PM phải bấm trên GitLab.
# `only.refs` giới hạn chỉ chạy trên các branch cụ thể.

.eas-base: &eas-base
  stage: eas-update
  image: node:20
  before_script:
    - corepack enable
    - yarn install --frozen-lockfile
    - npm i -g eas-cli@latest
    - echo "Publishing as $(eas whoami)"
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules

eas:update:preview:
  <<: *eas-base
  script:
    - yarn eas:update:preview
  when: manual
  only:
    refs:
      - main
      - feat/practice-one
  environment:
    name: preview
    url: https://expo.dev/accounts/hienduongs-organization/projects/expo-training/branches/preview

eas:update:promote:
  <<: *eas-base
  script:
    - yarn eas:update:promote
  when: manual
  only:
    refs:
      - main
      - feat/practice-one
  environment:
    name: production
    url: https://expo.dev/accounts/hienduongs-organization/projects/expo-training/branches/production
