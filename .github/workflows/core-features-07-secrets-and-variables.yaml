# Demo: use GitHub Secrets and GitHub Variables in 1 environment (EXPO_ENV).
# - secrets.NAME → sensitive value, GitHub mask when logged.
# - vars.NAME    → normal configuration value, NOT masked, can be read freely.

name: Core 07 - Secrets and Variables

on:
  # Push to the correct branch then workflow runs.
  push:
    branches:
      - feat/handle-enviroment-variables-ci-cd
  # Allow clicking "Run workflow" on Actions tab to test quickly.
  workflow_dispatch:

jobs:
  show-env:
    runs-on: ubuntu-24.04

    # Important: must declare environment then secrets/vars of EXPO_ENV are loaded.
    environment: EXPO_ENV

    # Map secrets/vars on GitHub to environment variables of job.
    env:
      # Variable (not sensitive) — see the actual value in logged.
      LOAD_STORYBOOK: ${{ vars.LOAD_STORYBOOK }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_STRAPI_BASE_URL: ${{ vars.EXPO_PUBLIC_STRAPI_BASE_URL }}

      # Secret (sensitive) — GitHub mask into *** in logged.
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      STRAPI_BASE_URL: ${{ secrets.STRAPI_BASE_URL }}

    steps:
      - name: Show Variables (not masked)
        run: |
          echo "LOAD_STORYBOOK=$LOAD_STORYBOOK"
          echo "EXPO_PUBLIC_API_BASE_URL=$EXPO_PUBLIC_API_BASE_URL"
          echo "EXPO_PUBLIC_STRAPI_BASE_URL=$EXPO_PUBLIC_STRAPI_BASE_URL"

      - name: Show Secrets (will see *** in logged)
        run: |
          echo "API_BASE_URL=$API_BASE_URL"
          echo "STRAPI_BASE_URL=$STRAPI_BASE_URL"
        # Example condition: only run this step when LOAD_STORYBOOK == "true".

      - name: Run when LOAD_STORYBOOK == 'true'
        if: ${{ env.LOAD_STORYBOOK == 'true' }}
        run: echo "Enable Storybook — set build storybook command here."
