name: Secrets and Environments

on:
  push:
    branches:
      - feat/handle-enviroment-variables-ci-cd

jobs:
  # No `environment` → only repository (and org if granted) secrets / variables.
  repository-context:
    runs-on: ubuntu-24.04
    env:
      EXAMPLE_REPOSITORY_SECRET: ${{ secrets.EXAMPLE_REPOSITORY_SECRET }}
      EXAMPLE_REPOSITORY_VARIABLE: ${{ vars.EXAMPLE_REPOSITORY_VARIABLE }}
    steps:
      # Docs: pass secret to environment variable then use in shell; avoid concatenating secret to command line.
      - name: Repository — step env + quoted use (Bash, same idea as docs)
        shell: bash
        env:
          SUPER_SECRET: ${{ secrets.EXAMPLE_REPOSITORY_SECRET }}
        run: |
          echo "Repo variable (vars):  $EXAMPLE_REPOSITORY_VARIABLE"
          echo "Repo secret (job env): $EXAMPLE_REPOSITORY_SECRET"
          if [ -n "$SUPER_SECRET" ]; then
            echo "SUPER_SECRET: set (GitHub masks secret values in logs when printed)"
          else
            echo "SUPER_SECRET: empty — create repo secret EXAMPLE_REPOSITORY_SECRET (Settings → Actions secrets)"
          fi

  # `environment: EXPO_ENV` → can see environment secrets/variables
  expo-environment:
    runs-on: ubuntu-24.04
    environment: EXPO_ENV
    # Job-level env: every step in job can see (same as "Or as an environment variable" in docs).
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      STRAPI_BASE_URL: ${{ secrets.STRAPI_BASE_URL }}
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_STRAPI_BASE_URL: ${{ secrets.EXPO_PUBLIC_STRAPI_BASE_URL }}
      LOAD_STORYBOOK: ${{ secrets.LOAD_STORYBOOK }}
    steps:
      - name: EXPO_ENV — verify all five names are non-empty
        shell: bash
        run: |
          for name in API_BASE_URL STRAPI_BASE_URL EXPO_PUBLIC_API_BASE_URL EXPO_PUBLIC_STRAPI_BASE_URL LOAD_STORYBOOK; do
            eval "val=\$$name"
            if [ -n "$val" ]; then
              echo "$name: OK (set)"
            else
              echo "$name: NOT SET — Settings → Environments → EXPO_ENV → Environment secrets"
            fi
          done

      # Docs snippet: step-level env + use variable with quoting (avoid special characters in URL breaking shell).
      - name: EXPO_ENV — docs-style single secret on step
        shell: bash
        env:
          SUPER_SECRET: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -n "$SUPER_SECRET" ]; then
            echo "API_BASE_URL available; example safe use: curl ... \"\$SUPER_SECRET\" (do not log URL in production)"
          else
            echo "API_BASE_URL missing"
          fi

      # Optional: LOAD_STORYBOOK is not sensitive → can be an Environment *variable* `vars.LOAD_STORYBOOK` instead of secret.
      - name: EXPO_ENV — optional non-secret flag via vars (uncomment if you create the
          variable)
        if: false
        shell: bash
        env:
          LOAD_STORYBOOK: ${{ vars.LOAD_STORYBOOK }}
        run: |
          echo "LOAD_STORYBOOK from vars: $LOAD_STORYBOOK"
